name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Installs and caches the tools mise.toml pins, at mise.lock's checksums.
      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.25

      - uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('mise.lock', 'go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: gofmt
        run: mise run fmt-check

      - name: go vet
        run: mise run vet

      - name: golangci-lint (seam rules)
        run: mise run lint

      - name: go test -race (repeated, shuffled)
        run: mise run test

      - name: release config, workflows and snapshot build
        run: mise run release-check

  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v5
        with:
          version: 2026.10.25

      - name: goreleaser release
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

      - name: warm Go module proxy
        run: GOPROXY=https://proxy.golang.org go list -m github.com/marvell/sprut@${{ github.ref_name }}
