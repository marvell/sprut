# Mechanical checks for the process boundary (seam 1 of the Sprut v0.1 spec,
# the Linear project description; see docs/agents/issue-tracker.md) and for
# black-box tests (ADR-0004). Run with `make lint`.
version: "2"

linters:
  default: standard
  enable:
    - forbidigo
    - revive
    - testpackage

  settings:
    revive:
      # Only the rules listed here run.
      rules:
        - name: context-as-argument

    forbidigo:
      # Match by package path, so an aliased import of os is still caught.
      analyze-types: true
      forbid:
        - pattern: ^os\.(Args|Environ|Getenv|LookupEnv|ExpandEnv|Setenv|Unsetenv|Clearenv|UserHomeDir|UserConfigDir|UserCacheDir|Stdin|Stdout|Stderr|Exit)$
          pkg: ^os$
          msg: "seam 1 owns the process boundary: only main may touch it; take args, env and streams as parameters of cli.Run instead"

    testpackage:
      # No exceptions, not even export_test.go: a test reaches its package
      # through the exported API alone (ADR-0004). main's test is in main
      # only to run main itself, as a process of its own.
      skip-regexp: ^$
      allow-packages: [main]

  exclusions:
    rules:
      # main wires the process boundary into cli.Run; the fake stdio
      # Upstream is a process of its own, which reads its env and exits.
      - path: ^main\.go$
        linters: [forbidigo]
      - path: ^internal/mcptest/stdio\.go$
        linters: [forbidigo]
      - path: _test\.go$
        linters: [forbidigo]

# `make fmt` runs these; `make check` runs gofmt only.
formatters:
  enable:
    - goimports
